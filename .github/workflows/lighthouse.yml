name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR 的新提交取消旧的 Lighthouse 运行
concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: 性能 / 可访问性 / 最佳实践
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm build

      # 读取 lighthouserc.json:静态托管 dist/ 并断言各项分数
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
