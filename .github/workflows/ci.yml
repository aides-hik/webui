name: CI

on:
  push:
    branches: [main]
  pull_request:

# 并发控制:同一分支的新 commit 自动取消旧 workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Type Check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 项目用 pnpm 10(pnpm/setup 仅支持 11+),显式指定与 packageManager 一致的版本
          version: 10.33.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          # jsdom 30 要求 Node ^22.22.2 || ^24.15.0 || >=26
          node-version: 24
          cache: pnpm # 基于 pnpm-lock.yaml 的依赖缓存

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Verify permission module coverage (≥100%)
        run: node .github/scripts/check-permission-coverage.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage/
          retention-days: 14

      - name: Build production
        run: pnpm build
